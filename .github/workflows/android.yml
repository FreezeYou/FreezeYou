name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP may place the debug keystore under XDG_CONFIG_HOME (~/.config/.android)
      # on Ubuntu 24.04 runners; that path is not writable unless created first.
      # See: https://github.com/firebase/snippets-android/issues/602
      - name: Prepare debug keystore directories
        run: |
          mkdir -p "$HOME/.android"
          mkdir -p "$HOME/.config/.android"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace
