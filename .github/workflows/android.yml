name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep these in sync with compileSdk and buildToolsVersion in app/build.gradle.
  ANDROID_SDK_PLATFORM: android-37.0
  ANDROID_BUILD_TOOLS: '37.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 18
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '18'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools platforms;${{ env.ANDROID_SDK_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      # AGP ValidateSigningTask always runs multi-process locking for the *default*
      # debug keystore path, which NPEs on some runners (cgroup anyController=null).
      # Use a project-local CI keystore with the usual debug credentials instead.
      - name: Create CI debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/.ci/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          CI_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci/debug.keystore
        run: ./gradlew assembleDebug --stacktrace
